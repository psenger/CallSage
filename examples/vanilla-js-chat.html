<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallSage Insurance Assistant - Vanilla JS Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .audio-upload {
            margin-bottom: 20px;
        }

        .audio-upload label {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .audio-upload label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
        }

        .audio-upload input[type="file"] {
            display: none;
        }

        .loading {
            padding: 20px;
            background: #f0f0f0;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .error {
            padding: 20px;
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 8px;
            color: #c00;
            margin-bottom: 20px;
        }

        .response {
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .confidence-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            margin-bottom: 16px;
        }

        .confidence-high { background: #4caf50; }
        .confidence-medium { background: #ff9800; }
        .confidence-low { background: #f44336; }

        .response-text {
            padding: 16px;
            background: white;
            border-radius: 8px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .sources {
            margin-top: 16px;
        }

        .sources h3 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .source-item {
            padding: 10px 12px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .examples {
            margin-top: 40px;
        }

        .examples h3 {
            margin-bottom: 12px;
        }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 16px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Insurance Assistant</h1>
            <p>Ask questions about your insurance policy and coverage</p>
        </div>

        <div class="content">
            <!-- Text Input -->
            <div class="input-group">
                <input
                    type="text"
                    id="queryInput"
                    placeholder="Ask a question about your insurance policy..."
                />
                <button class="btn-primary" id="submitBtn">Ask</button>
            </div>

            <!-- Audio Upload -->
            <div class="audio-upload">
                <label for="audioInput">🎤 Upload Audio Question (about your policy)</label>
                <input type="file" id="audioInput" accept="audio/*" />
            </div>

            <!-- Loading State -->
            <div id="loading" class="loading" style="display: none;">
                <p>⏳ Processing your question...</p>
            </div>

            <!-- Error State -->
            <div id="error" class="error" style="display: none;"></div>

            <!-- Response -->
            <div id="response" class="response" style="display: none;"></div>

            <!-- Example Queries -->
            <div class="examples">
                <h3>💡 Example Questions:</h3>
                <div class="example-buttons">
                    <button class="example-btn" data-query="What does this insurance policy cover?">
                        What does this insurance policy cover?
                    </button>
                    <button class="example-btn" data-query="How do I make a claim?">
                        How do I make a claim?
                    </button>
                    <button class="example-btn" data-query="What are the exclusions?">
                        What are the exclusions?
                    </button>
                    <button class="example-btn" data-query="What is the excess amount?">
                        What is the excess amount?
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        const elements = {
            queryInput: document.getElementById('queryInput'),
            submitBtn: document.getElementById('submitBtn'),
            audioInput: document.getElementById('audioInput'),
            loading: document.getElementById('loading'),
            error: document.getElementById('error'),
            response: document.getElementById('response')
        };

        // Handle text query
        async function handleTextQuery() {
            const query = elements.queryInput.value.trim();
            if (!query) return;

            showLoading();
            hideError();
            hideResponse();

            try {
                const response = await fetch(`${API_BASE_URL}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: query })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                showResponse(data);
            } catch (err) {
                showError(err.message);
            } finally {
                hideLoading();
            }
        }

        // Handle audio upload
        async function handleAudioQuery(file) {
            showLoading();
            hideError();
            hideResponse();

            try {
                const formData = new FormData();
                formData.append('audio', file);

                const response = await fetch(`${API_BASE_URL}/process`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                showResponse(data);
            } catch (err) {
                showError(err.message);
            } finally {
                hideLoading();
            }
        }

        // UI update functions
        function showLoading() {
            elements.loading.style.display = 'block';
            elements.submitBtn.disabled = true;
        }

        function hideLoading() {
            elements.loading.style.display = 'none';
            elements.submitBtn.disabled = false;
        }

        function showError(message) {
            elements.error.textContent = `❌ Error: ${message}`;
            elements.error.style.display = 'block';
        }

        function hideError() {
            elements.error.style.display = 'none';
        }

        function hideResponse() {
            elements.response.style.display = 'none';
        }

        function showResponse(data) {
            const confidence = data.confidence;
            const confidenceClass = confidence > 0.85 ? 'confidence-high' :
                                  confidence > 0.7 ? 'confidence-medium' :
                                  'confidence-low';

            let html = `
                <div class="confidence-badge ${confidenceClass}">
                    ${(confidence * 100).toFixed(0)}% Confidence
                </div>
                <span style="margin-left: 12px; color: #666; font-size: 14px;">
                    ${data.processing_time_ms}ms
                </span>

                <div class="response-text">
                    ${data.response}
                </div>
            `;

            if (data.sources && data.sources.length > 0) {
                html += `
                    <div class="sources">
                        <h3>📚 Sources:</h3>
                        ${data.sources.map(source => `
                            <div class="source-item">
                                <strong>${source.document}</strong>
                                <span style="color: #666; margin-left: 8px;">
                                    (${(source.relevance * 100).toFixed(0)}% relevant)
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            elements.response.innerHTML = html;
            elements.response.style.display = 'block';
        }

        // Event listeners
        elements.submitBtn.addEventListener('click', handleTextQuery);

        elements.queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleTextQuery();
            }
        });

        elements.audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleAudioQuery(file);
            }
        });

        // Example buttons
        document.querySelectorAll('.example-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const query = btn.getAttribute('data-query');
                elements.queryInput.value = query;
                hideResponse();
            });
        });
    </script>
</body>
</html>
